{% extends "base.html" %}
{% from "macros.html" import icon, csrf, status_badge, pagination, period_filter with context %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<div class="page-head"><h1>Смена пароля</h1></div>
<form class="card" method="post" style="max-width: 460px;">
  {{ csrf() }}
  <div class="card-body stack">
    {% for e in errors %}<div class="flash flash-error">{{ e }}</div>{% endfor %}
    <div class="field"><label for="current">Текущий пароль</label><input type="password" id="current" name="current" autocomplete="current-password" required></div>
    <div class="field"><label for="password">Новый пароль</label><input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required></div>
    <div class="field"><label for="password2">Новый пароль ещё раз</label><input type="password" id="password2" name="password2" autocomplete="new-password" required></div>
    <div class="form-actions"><button class="btn btn-primary">Сохранить</button><a class="btn btn-ghost" href="{{ url_for('dashboard.index') }}">Отмена</a></div>
  </div>
</form>
{% endblock %}
