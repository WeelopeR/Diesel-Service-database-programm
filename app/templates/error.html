{% extends "base.html" if current_user else "auth/base.html" %}
{% from "macros.html" import icon, csrf, status_badge, pagination, period_filter with context %}
{% block title %}Ошибка {{ code }}{% endblock %}
{% block content %}
<div class="card" style="max-width: 520px;">
  <div class="card-body">
    <h1 style="margin-bottom: 8px;">Ошибка {{ code }}</h1>
    <p class="muted">{{ message }}</p>
    <div class="form-actions"><a class="btn" href="{{ url_for('dashboard.index') }}">На главную</a></div>
  </div>
</div>
{% endblock %}
